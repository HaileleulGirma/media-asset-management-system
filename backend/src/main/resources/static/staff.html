<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff — MAM</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
    <div id="app-nav"></div>

    <div class="main-content">
        <div class="panel">
            <div class="panel-header-row">
                <h2>Staff</h2>
                <button type="button" id="add-staff-btn" class="btn btn-primary hidden">+ Add staff member</button>
            </div>

            <div class="field">
                <label class="checkbox-label">
                    <input type="checkbox" id="staffActiveOnly" checked />
                    Active only
                </label>
            </div>

            <div id="staff-alert" class="alert"></div>

            <div id="staff-empty" class="empty-state hidden">No staff members found.</div>
            <table id="staff-table" class="hidden">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th id="staff-actions-header" class="hidden">Actions</th>
                </tr>
                </thead>
                <tbody id="staff-body"></tbody>
            </table>

            <div id="staff-pagination" class="pagination hidden">
                <button type="button" id="staff-page-prev" class="btn btn-secondary">Previous</button>
                <span id="staff-page-status"></span>
                <button type="button" id="staff-page-next" class="btn btn-secondary">Next</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit staff modal -->
    <div id="staff-modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="staff-modal-title">Add staff member</h2>
                <button type="button" id="staff-modal-close" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="staff-modal-alert" class="alert"></div>

                <form id="staff-form" novalidate>
                    <input type="hidden" id="staffMemberId" />

                    <div class="field" data-field="staffMemberName">
                        <label for="staffMemberName">Name</label>
                        <input type="text" id="staffMemberName" required />
                        <div class="hint">Must include first and last name.</div>
                        <div class="field-error"></div>
                    </div>

                    <div class="field" data-field="isActive">
                        <label class="checkbox-label">
                            <input type="checkbox" id="staffIsActive" checked />
                            Active
                        </label>
                        <div class="field-error"></div>
                    </div>

                    <div class="modal-actions">
                        <button type="submit" id="staff-form-submit" class="btn btn-primary">Save</button>
                        <button type="button" id="staff-form-cancel" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/staff.js"></script>
</body>
</html>
