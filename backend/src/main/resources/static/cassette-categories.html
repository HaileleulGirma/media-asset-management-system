<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cassette Categories — MAM</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
    <div id="app-nav"></div>

    <div class="main-content main-content--wide">

        <!-- Add category (ADMIN only; cassette-categories.js replaces the page for everyone else) -->
        <div class="panel">
            <h2>Add cassette category</h2>
            <p class="hint">A category is the shelf label on a cassette, for example "Parliament". Create the category first, then add cassettes under it. Cuts inside a cassette can use a different category.</p>

            <div id="create-category-alert" class="alert"></div>

            <form id="create-category-form" novalidate>
                <div class="field" data-field="categoryName" style="max-width: 320px;">
                    <label for="categoryName">Category name</label>
                    <input type="text" id="categoryName" name="categoryName" maxlength="255" required />
                    <div class="field-error"></div>
                </div>

                <button type="submit" id="create-category-submit" class="btn btn-primary">Add category</button>
            </form>
        </div>

        <div class="panel">
            <h2>All categories</h2>

            <div id="categories-alert" class="alert"></div>
            <div id="categories-empty" class="empty-state hidden">No categories yet.</div>

            <table id="categories-table" class="hidden">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="categories-body"></tbody>
            </table>
        </div>

        <!-- Edit category modal -->
        <div id="edit-category-overlay" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Rename category</h2>
                    <button type="button" id="edit-category-close" class="modal-close-btn" aria-label="Close">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="edit-category-alert" class="alert"></div>

                    <form id="edit-category-form" novalidate>
                        <input type="hidden" id="editCategoryId" />

                        <div class="field" data-field="categoryName">
                            <label for="editCategoryName">Category name</label>
                            <input type="text" id="editCategoryName" required />
                            <div class="field-error"></div>
                        </div>

                        <div class="modal-actions">
                            <button type="submit" id="edit-category-submit" class="btn btn-primary">Save changes</button>
                            <button type="button" id="edit-category-cancel" class="btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/cassette-categories.js"></script>
</body>
</html>
