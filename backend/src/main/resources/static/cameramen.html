<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cameramen — MAM</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
    <div id="app-nav"></div>

    <div class="main-content">
        <div class="panel">
            <div class="panel-header-row">
                <h2>Cameramen</h2>
                <button type="button" id="add-cameraman-btn" class="btn btn-primary hidden">+ Add cameraman</button>
            </div>

            <div class="field">
                <label class="checkbox-label">
                    <input type="checkbox" id="cameramenActiveOnly" checked />
                    Active only
                </label>
            </div>

            <div id="cameramen-alert" class="alert"></div>

            <div id="cameramen-empty" class="empty-state hidden">No cameramen found.</div>
            <table id="cameramen-table" class="hidden">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th id="cameramen-actions-header" class="hidden">Actions</th>
                </tr>
                </thead>
                <tbody id="cameramen-body"></tbody>
            </table>

            <div id="cameramen-pagination" class="pagination hidden">
                <button type="button" id="cameramen-page-prev" class="btn btn-secondary">Previous</button>
                <span id="cameramen-page-status"></span>
                <button type="button" id="cameramen-page-next" class="btn btn-secondary">Next</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit cameraman modal -->
    <div id="cameraman-modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="cameraman-modal-title">Add cameraman</h2>
                <button type="button" id="cameraman-modal-close" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="cameraman-modal-alert" class="alert"></div>

                <form id="cameraman-form" novalidate>
                    <input type="hidden" id="cameramanId" />

                    <div class="field" data-field="cameramanName">
                        <label for="cameramanName">Name</label>
                        <input type="text" id="cameramanName" required />
                        <div class="hint">Must include first and last name.</div>
                        <div class="field-error"></div>
                    </div>

                    <div class="field" data-field="isActive">
                        <label class="checkbox-label">
                            <input type="checkbox" id="cameramanIsActive" checked />
                            Active
                        </label>
                        <div class="field-error"></div>
                    </div>

                    <div class="modal-actions">
                        <button type="submit" id="cameraman-form-submit" class="btn btn-primary">Save</button>
                        <button type="button" id="cameraman-form-cancel" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/cameramen.js"></script>
</body>
</html>
